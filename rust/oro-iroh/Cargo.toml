[package]
name = "oro-iroh"
version = "0.1.0"
edition = "2021"

[lib]
name = "oro_iroh"
crate-type = ["staticlib"]

[dependencies]
anyhow = "1.0"
once_cell = "1.19"
parking_lot = "0.12"
bytes = "1.6"
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures-util = "0.3"
iroh = { path = "../../build/iroh/iroh", default-features = false }
iroh-base = { path = "../../build/iroh/iroh-base" }
iroh-blobs = "0.35"
tracing-subscriber = "0.3"
