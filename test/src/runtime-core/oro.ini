[meta]
name = "runtime-core-tests"
type = "extension"

[extension]
# support files
sources[] = ../../deps/ok/ok.h
sources[] = ./harness.cc
sources[] = ./main.cc
sources[] = ./ok.cc

# test files
sources[] = ./codec.cc
sources[] = ./config.cc
sources[] = ./env.cc
sources[] = ./ini.cc
sources[] = ./json.cc
sources[] = ./mcp.cc
sources[] = ./toml.cc
sources[] = ./platform.cc
sources[] = ./preload.cc
sources[] = ./restart.cc
sources[] = ./state_manager.cc
sources[] = ./string.cc
sources[] = ./tar.cc
sources[] = ./version.cc
sources[] = ./webview_tls_pins.cc

[extension.compiler]
flags[] = -I../../..
# StateManager includes the generated SQLite header from the runtime build tree.
flags[] = -I../../../build

[extension.mac.compiler]
flags[] = -fsanitize-undefined-trap-on-error
flags[] = -fsanitize=undefined-trap
flags[] = -ftrap-function=abort
