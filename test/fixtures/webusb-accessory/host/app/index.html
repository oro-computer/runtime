<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Oro WebUSB bulk echo</title>
    <style>
      body { font: 1rem system-ui; margin: 2rem; }
      button { padding: 0.5rem; }
      pre { white-space: pre-wrap; }
    </style>
    <script type="module" src="./main.js"></script>

  <body>
    <h1>Pixel bulk echo</h1>
