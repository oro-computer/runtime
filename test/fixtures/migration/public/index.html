<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Public history migration</title>
<style>body { background:#112238;color:#fff;font:18px sans-serif;padding:24px }button { padding:16px;margin:8px }</style>
<h1>Public history migration</h1>
<p>This isolated app uses seeded public values only.</p>
<button id="support">Check support</button><pre id="result">Starting</pre>
<script type="module">
import migration from 'oro:migration'
import application from 'oro:application'
window.publicMigration = (action,options={}) => migration[action](options)
document.querySelector('#support').onclick=async()=>{document.querySelector('#result').textContent=JSON.stringify(await migration.getSupport(),null,2)}
window.publicMigrationReady = true
await (await application.getCurrentWindow()).markReady()
document.querySelector('#result').textContent='Ready for public checks'
</script>
