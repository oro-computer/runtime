import groovy.json.JsonOutput
import groovy.json.JsonSlurper

// Applied only to an isolated project generated by the normal Oro Android generator.
def inputs = new JsonSlurper().parse(rootProject.file('oro-editor-inputs.json'))
def selectedVariant = providers.gradleProperty('oro.editor.variant').getOrElse('devDebug')
def prepare = providers.gradleProperty('oro.editor.prepare').getOrElse('false') == 'true'
def selected = null

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
  if (variant.name == selectedVariant) selected = variant
}

// AGP registers compile tasks after onVariants callbacks. Resolve providers only
// once that registration has completed.
gradle.projectsEvaluated {
  if (selected == null) {
    throw new GradleException("Oro editor model: unknown variant '${selectedVariant}'. Select a variant declared by the generated Android project (for example devDebug or liveRelease).")
  }
  def variant = selected
  def capitalized = variant.name.substring(0, 1).toUpperCase(Locale.ROOT) + variant.name.substring(1)
  def kotlinCompile = tasks.named("compile${capitalized}Kotlin")
  def javaCompile = tasks.named("compile${capitalized}JavaWithJavac")
  // This isolated project compiles SDK and generated resource classes only.
  // Original application files are analyzed by the server, including broken code.
  def kotlin = kotlinCompile.get()
  def javac = javaCompile.get()
  if (!kotlin.hasProperty('libraries') || !kotlin.hasProperty('destinationDirectory') ||
      !kotlin.hasProperty('compilerOptions')) {
    throw new GradleException('Oro editor model: unsupported Kotlin compile task API; upgrade the Oro SDK.')
  }
  // Preserve the FileCollections' producer dependencies until task execution.
  // Enumerating generated sources without them fails even if an earlier Gradle
  // invocation already wrote the files (for example GenerateBuildConfig).
  def compilationSources = project.files(kotlin.sources, javac.source)
  def compilationClasspath = kotlin.libraries
  tasks.register('oroEditorModel') {
    dependsOn(compilationSources, compilationClasspath)
    // The Kotlin libraries are the analysis classpath. Javac's classpath also
    // includes this variant's Kotlin output; consuming it here would require
    // compiling the application even when --prepare was not requested.
    if (prepare) dependsOn(kotlinCompile, javaCompile)
    doLast {
      def paths = { files -> files.collect { it.canonicalPath }.unique().sort() }
      def options = kotlin.compilerOptions
      def originalSources = inputs.originalSources.collect { file(it).canonicalPath }.unique().sort()
      def sourcePaths = paths(compilationSources.files)
      def classpath = paths(compilationClasspath.files)
      // Query locations independently of whether compilation has run.
      def outputDirectories = [kotlin.destinationDirectory.locationOnly.get().asFile]
      if (!javac.source.files.empty) outputDirectories.add(javac.destinationDirectory.locationOnly.get().asFile)
      def javaMetadata = javac.javaCompiler.get().metadata
      def model = [
        schemaVersion: 1,
        language: 'kotlin',
        platform: 'android',
        projectRoot: inputs.projectRoot,
        configuration: inputs.configuration,
        variant: variant.name,
        originalSources: originalSources,
        generatedSources: sourcePaths.findAll { !originalSources.contains(it) },
        compileClasspath: classpath,
        runtimeClasses: paths(outputDirectories),
        tasks: [kotlin: kotlin.path, java: javac.path],
        compiler: [
          jvmTarget: options.jvmTarget.get().target,
          languageVersion: options.languageVersion.orNull?.version,
          apiVersion: options.apiVersion.orNull?.version,
          freeCompilerArgs: options.freeCompilerArgs.get(),
          javaSource: javac.sourceCompatibility,
          javaTarget: javac.targetCompatibility
        ],
        jdk: [
          compilerHome: javaMetadata.installationPath.asFile.canonicalPath,
          compilerVersion: javaMetadata.languageVersion.asInt(),
          gradleHome: System.getProperty('java.home'),
          gradleJavaVersion: System.getProperty('java.version')
        ],
        android: [compileSdk: android.compileSdk, sdkDirectory: androidComponents.sdkComponents.sdkDirectory.get().asFile.canonicalPath],
        gradleVersion: gradle.gradleVersion,
        runtime: inputs.runtime,
        prepared: prepare
      ]
      def destination = rootProject.file(providers.gradleProperty('oro.editor.output').get())
      destination.parentFile.mkdirs()
      destination.text = JsonOutput.prettyPrint(JsonOutput.toJson(model)) + '\n'
    }
  }
}
