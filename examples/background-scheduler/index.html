<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Background Services Example</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Background Scheduler</h1>
      <p>
        Demonstrates registering and scheduling a background task. This stub UI logs
        lifecycle events so you can verify the worker integration once platform
        runners are implemented.
      </p>
      <section class="controls">
        <button id="register">Register Task</button>
        <button id="schedule">Schedule Task</button>
        <button id="cancel">Cancel Task</button>
      </section>
      <section class="log" id="log"></section>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
