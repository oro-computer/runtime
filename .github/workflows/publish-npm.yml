name: Publish npm packages

on:
  workflow_call:
    inputs:
      ref:
        description: Signed release tag to package or publish
        required: true
        type: string
      version:
        description: Semantic version without the v prefix
        required: true
        type: string
      publish:
        description: Publish the verified tarballs to npm
        required: false
        default: false
        type: boolean
      reuse_release_artifacts:
        description: Package the runtime distributions already built by the calling release workflow
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      ref:
        description: Signed release tag to package for inspection
        required: true
        default: v0.1.0
        type: string
      version:
        description: Semantic version without the v prefix
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  RELEASE_REF: ${{ inputs.ref }}
  RELEASE_VERSION: ${{ inputs.version }}

concurrency:
  group: npm-publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate signed release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit_sha: ${{ steps.verify-tag.outputs.commit_sha }}
    steps:
      - name: Require matching version tag
        shell: bash
        run: |
          expected_ref="v$RELEASE_VERSION"
          if [[ "$RELEASE_REF" != "$expected_ref" ]]; then
            echo >&2 "ref must be $expected_ref for version $RELEASE_VERSION"
            exit 1
          fi

      - name: Verify annotated tag signature
        id: verify-tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref_json="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_REF")"
          object_type="$(jq -r '.object.type' <<< "$ref_json")"
          if [[ "$object_type" != "tag" ]]; then
            echo >&2 "$RELEASE_REF must be an annotated, signed tag"
            exit 1
          fi

          tag_sha="$(jq -r '.object.sha' <<< "$ref_json")"
          verification="$(gh api "/repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")"
          if [[ "$(jq -r '.verification.verified' <<< "$verification")" != "true" ]]; then
            reason="$(jq -r '.verification.reason' <<< "$verification")"
            echo >&2 "$RELEASE_REF signature is not verified: $reason"
            exit 1
          fi

          target_type="$(jq -r '.object.type' <<< "$verification")"
          if [[ "$target_type" != "commit" ]]; then
            echo >&2 "$RELEASE_REF must point directly to a commit, not $target_type"
            exit 1
          fi

          commit_sha="$(jq -r '.object.sha' <<< "$verification")"
          if [[ ! "$commit_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo >&2 "$RELEASE_REF resolved to an invalid commit SHA: $commit_sha"
            exit 1
          fi
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout signed release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.verify-tag.outputs.commit_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x

      - name: Verify synchronized release metadata
        run: node ./bin/check-release-version.js "$RELEASE_VERSION"

  platform-packages:
    name: Pack ${{ matrix.package }}
    needs: [validate-tag, top-level-packages]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: linux-x64
            os: ubuntu-24.04
            runtime_artifact_id: linux-x64-android-sdk
            runtime_archive_ext: tar.gz
            build_android: true
            exclude_android: false
            exclude_ios: true
          - package: linux-arm64
            os: ubuntu-24.04-arm
            runtime_artifact_id: linux-arm64-desktop
            runtime_archive_ext: tar.gz
            build_android: false
            exclude_android: true
            exclude_ios: true
          - package: darwin-x64
            os: macos-15-intel
            runtime_artifact_id: macos-x64-ios-sdk
            runtime_archive_ext: tar.gz
            build_android: false
            exclude_android: true
            exclude_ios: false
          - package: darwin-arm64
            os: macos-14
            runtime_artifact_id: macos-arm64-ios-sdk
            runtime_archive_ext: tar.gz
            build_android: false
            exclude_android: true
            exclude_ios: false
          - package: win32-x64
            os: windows-2022
            runtime_artifact_id: windows-x64-desktop
            runtime_archive_ext: zip
            build_android: false
            exclude_android: true
            exclude_ios: true
    env:
      BUILD_ANDROID: ${{ matrix.build_android }}
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      EXCLUDE_ANDROID: ${{ matrix.exclude_android }}
      EXCLUDE_IOS: ${{ matrix.exclude_ios }}
      PACKAGE_ID: ${{ matrix.package }}
      ORO_PRUNE_IROH_BUILD_OUTPUTS: ${{ matrix.build_android }}
      ORO_PRUNE_TRANSIENT_BUILD_OUTPUTS: ${{ matrix.build_android }}
      ORO_SKIP_PATH_PROMPT: '1'
      REUSE_RELEASE_ARTIFACTS: ${{ inputs.reuse_release_artifacts }}
      RUNTIME_ARCHIVE_EXT: ${{ matrix.runtime_archive_ext }}
      RUNTIME_ARTIFACT_ID: ${{ matrix.runtime_artifact_id }}
    steps:
      - name: Checkout signed release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate-tag.outputs.commit_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Setup Go for libipfs
        if: ${{ !inputs.reuse_release_artifacts }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.23.2'
          cache: false

      - name: Setup Windows native compiler cache
        if: ${{ !inputs.reuse_release_artifacts && runner.os == 'Windows' }}
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Configure Windows native compiler cache
        if: ${{ !inputs.reuse_release_artifacts && runner.os == 'Windows' }}
        shell: bash
        run: |
          {
            echo 'SCCACHE_GHA_ENABLED=true'
            echo 'RUSTC_WRAPPER=sccache'
            echo 'CMAKE_C_COMPILER_LAUNCHER=sccache'
            echo 'CMAKE_CXX_COMPILER_LAUNCHER=sccache'
          } >> "$GITHUB_ENV"

      - name: Setup Java for Android package
        if: ${{ !inputs.reuse_release_artifacts && matrix.build_android }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            bin/android-functions.sh
            bin/generate-gradle-files.sh

      - name: Resolve Android SDK cache root
        if: ${{ !inputs.reuse_release_artifacts && matrix.build_android }}
        id: android-sdk
        shell: bash
        run: echo "root=$ANDROID_HOME" >> "$GITHUB_OUTPUT"

      - name: Restore Android build SDK cache
        if: ${{ !inputs.reuse_release_artifacts && matrix.build_android }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ steps.android-sdk.outputs.root }}/build-tools/36.0.0
            ${{ steps.android-sdk.outputs.root }}/cmdline-tools/23.0
            ${{ steps.android-sdk.outputs.root }}/ndk/29.0.14206865
            ${{ steps.android-sdk.outputs.root }}/platform-tools
            ${{ steps.android-sdk.outputs.root }}/platforms/android-37*
          key: android-build-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bin/android-functions.sh') }}

      - name: Restore native compiler cache
        if: ${{ !inputs.reuse_release_artifacts && runner.os != 'Windows' }}
        id: native-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: npm-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package }}-${{ needs.validate-tag.outputs.commit_sha }}-${{ github.run_attempt }}
          restore-keys: |
            npm-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package }}-${{ needs.validate-tag.outputs.commit_sha }}-
            npm-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.package }}-
            npm-ccache-v1-${{ runner.os }}-${{ runner.arch }}-
            release-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.runtime_artifact_id }}-

      - name: Restore Rust dependency cache
        if: ${{ !inputs.reuse_release_artifacts }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/**/Cargo.lock', 'rust/**/Cargo.toml') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore Go build cache
        if: ${{ !inputs.reuse_release_artifacts }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cache/go-build
            .cache/go-mod
          key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bin/install.sh') }}
          restore-keys: |
            go-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux build dependencies
        if: ${{ !inputs.reuse_release_artifacts && runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            ccache \
            clang-18 \
            curl \
            git \
            libdbus-1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libsystemd-dev \
            libtool \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Install macOS build dependencies
        if: ${{ !inputs.reuse_release_artifacts && runner.os == 'macOS' }}
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install automake ccache libtool pkg-config

      - name: Configure native compiler cache
        if: ${{ !inputs.reuse_release_artifacts && runner.os != 'Windows' }}
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            echo /usr/lib/ccache >> "$GITHUB_PATH"
          else
            echo "$(brew --prefix ccache)/libexec" >> "$GITHUB_PATH"
          fi
          echo 'CMAKE_C_COMPILER_LAUNCHER=ccache' >> "$GITHUB_ENV"
          echo 'CMAKE_CXX_COMPILER_LAUNCHER=ccache' >> "$GITHUB_ENV"
          ccache --max-size 500M
          ccache --zero-stats

      - name: Verify synchronized release metadata
        shell: bash
        run: node ./bin/check-release-version.js "$RELEASE_VERSION"

      - name: Configure platform package target families
        shell: bash
        run: |
          if [[ "$EXCLUDE_ANDROID" == "true" ]]; then
            echo "NO_ANDROID=1" >> "$GITHUB_ENV"
          else
            echo "NO_ANDROID=" >> "$GITHUB_ENV"
          fi

          if [[ "$EXCLUDE_IOS" == "true" ]]; then
            echo "NO_IOS=1" >> "$GITHUB_ENV"
          else
            echo "NO_IOS=" >> "$GITHUB_ENV"
          fi

          if [[ "$BUILD_ANDROID" == "true" ]]; then
            echo "ORO_ANDROID_CI=1" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_MANAGER_ACCEPT_LICENSES=yes" >> "$GITHUB_ENV"
          fi

      - name: Build Windows runtime for npm package
        if: ${{ !inputs.reuse_release_artifacts && runner.os == 'Windows' }}
        shell: pwsh
        env:
          ORO_HOME: ${{ github.workspace }}\build\npm\win32
          PREFIX: ${{ github.workspace }}\build\npm\win32
        run: .\bin\install.ps1 -yesdeps -verbose

      - name: Build and pack platform package (Unix)
        if: ${{ !inputs.reuse_release_artifacts && runner.os != 'Windows' }}
        shell: bash
        run: |
          pack_dir="$RUNNER_TEMP/npm-packs"
          mkdir -p "$pack_dir"
          ./bin/publish-npm-modules.sh --only-platforms --yes-deps --dry-run --pack-destination "$pack_dir"

      - name: Download verified release runtime distribution
        if: inputs.reuse_release_artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: oro-runtime-${{ inputs.version }}-${{ matrix.runtime_artifact_id }}
          path: ${{ runner.temp }}/npm-runtime-artifact

      - name: Stage verified release runtime (Unix)
        if: ${{ inputs.reuse_release_artifacts && runner.os != 'Windows' }}
        shell: bash
        run: |
          archive="$RUNNER_TEMP/npm-runtime-artifact/oro-runtime-$RELEASE_VERSION-$RUNTIME_ARTIFACT_ID.$RUNTIME_ARCHIVE_EXT"
          staging="$GITHUB_WORKSPACE/build/npm/$PACKAGE_ID"
          if [[ ! -f "$archive" ]]; then
            echo >&2 "Missing verified runtime archive: $archive"
            exit 1
          fi
          mkdir -p "$staging"
          tar -xzf "$archive" --strip-components=1 -C "$staging"
          echo "ORO_NPM_STAGING_HOME=$staging" >> "$GITHUB_ENV"

      - name: Stage verified release runtime (Windows)
        if: ${{ inputs.reuse_release_artifacts && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "npm-runtime-artifact\oro-runtime-$env:RELEASE_VERSION-$env:RUNTIME_ARTIFACT_ID.$env:RUNTIME_ARCHIVE_EXT"
          $extract = Join-Path $env:RUNNER_TEMP 'npm-runtime-extract'
          $runtimeRoot = Join-Path $extract "oro-runtime-$env:RELEASE_VERSION-$env:RUNTIME_ARTIFACT_ID"
          $staging = Join-Path $env:GITHUB_WORKSPACE "build\npm\$env:PACKAGE_ID"
          if (-not (Test-Path $archive -PathType Leaf)) {
            throw "Missing verified runtime archive: $archive"
          }
          New-Item -ItemType Directory -Force -Path $extract, $staging | Out-Null
          Expand-Archive -Path $archive -DestinationPath $extract
          if (-not (Test-Path $runtimeRoot -PathType Container)) {
            throw "Runtime archive is missing expected root: $runtimeRoot"
          }
          Get-ChildItem -Force $runtimeRoot | Copy-Item -Destination $staging -Recurse -Force
          "ORO_NPM_STAGING_HOME=$staging" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Pack verified release runtime (Unix)
        if: ${{ inputs.reuse_release_artifacts && runner.os != 'Windows' }}
        shell: bash
        run: |
          pack_dir="$RUNNER_TEMP/npm-packs"
          mkdir -p "$pack_dir"
          ./bin/publish-npm-modules.sh --only-platforms --no-rebuild --no-remove-oro-home --dry-run --pack-destination "$pack_dir"

      - name: Pack platform package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pack_dir="$RUNNER_TEMP/npm-packs"
          mkdir -p "$pack_dir"
          ./bin/publish-npm-modules.sh --only-platforms --no-rebuild --no-remove-oro-home --dry-run --pack-destination "$pack_dir"

      - name: Save native compiler cache
        if: ${{ !cancelled() && !inputs.reuse_release_artifacts && runner.os != 'Windows' && steps.native-cache.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Report native compiler cache
        if: ${{ always() && !inputs.reuse_release_artifacts && runner.os != 'Windows' }}
        shell: bash
        run: ccache --show-stats || true

      - name: Download exact top-level tarballs for native smoke test
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-pack-${{ inputs.version }}-top-level
          path: ${{ runner.temp }}/npm-smoke-packs

      - name: Smoke install exact package family on native runner
        shell: bash
        run: |
          platform_archive="$RUNNER_TEMP/npm-packs/oro-computer-runtime-$PACKAGE_ID-$RELEASE_VERSION.tgz"
          node_archive="$RUNNER_TEMP/npm-smoke-packs/oro-computer-runtime-node-$RELEASE_VERSION.tgz"
          meta_archive="$RUNNER_TEMP/npm-smoke-packs/oro-computer-runtime-$RELEASE_VERSION.tgz"

          for archive in "$platform_archive" "$node_archive" "$meta_archive"; do
            if [[ ! -f "$archive" ]]; then
              echo >&2 "Missing exact package tarball for smoke install: $archive"
              exit 1
            fi
          done

          smoke_root="$RUNNER_TEMP/npm-smoke-install"
          npm install \
            --prefix "$smoke_root" \
            --no-package-lock \
            --no-save \
            --no-audit \
            --no-fund \
            "$platform_archive" \
            "$node_archive" \
            "$meta_archive"

          node "$smoke_root/node_modules/@oro-computer/runtime/bin/oroc.js" --version
          node "$smoke_root/node_modules/@oro-computer/runtime/bin/oroc.js" --help
          node -e 'require(process.argv[1]); process.exit(0)' \
            "$smoke_root/node_modules/@oro-computer/runtime-node/index.cjs"

      - name: Upload platform package tarball
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-pack-${{ inputs.version }}-${{ matrix.package }}
          path: ${{ runner.temp }}/npm-packs/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  top-level-packages:
    name: Pack Node adapter and meta-package
    needs: validate-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout signed release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate-tag.outputs.commit_sha }}

      - name: Setup pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify synchronized release metadata
        run: node ./bin/check-release-version.js "$RELEASE_VERSION"

      - name: Pack Node adapter and meta-package
        shell: bash
        run: |
          pack_dir="$RUNNER_TEMP/npm-packs"
          mkdir -p "$pack_dir"
          ./bin/publish-npm-modules.sh --only-top-level --no-rebuild --dry-run --pack-destination "$pack_dir"

      - name: Upload top-level package tarballs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-pack-${{ inputs.version }}-top-level
          path: ${{ runner.temp }}/npm-packs/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish verified tarballs to npm
    if: inputs.publish
    needs: [validate-tag, platform-packages, top-level-packages]
    environment: npm-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js with npm trusted publishing support
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Install npm trusted publishing client
        run: npm install --global npm@11.19.1

      - name: Download exact package tarballs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: npm-pack-${{ inputs.version }}-*
          path: ${{ runner.temp }}/npm-packs
          merge-multiple: true

      - name: Verify complete npm package set
        shell: bash
        run: |
          pack_dir="$RUNNER_TEMP/npm-packs"
          expected=(
            "@oro-computer/runtime-linux-x64|oro-computer-runtime-linux-x64-$RELEASE_VERSION.tgz"
            "@oro-computer/runtime-linux-arm64|oro-computer-runtime-linux-arm64-$RELEASE_VERSION.tgz"
            "@oro-computer/runtime-darwin-x64|oro-computer-runtime-darwin-x64-$RELEASE_VERSION.tgz"
            "@oro-computer/runtime-darwin-arm64|oro-computer-runtime-darwin-arm64-$RELEASE_VERSION.tgz"
            "@oro-computer/runtime-win32-x64|oro-computer-runtime-win32-x64-$RELEASE_VERSION.tgz"
            "@oro-computer/runtime-node|oro-computer-runtime-node-$RELEASE_VERSION.tgz"
            "@oro-computer/runtime|oro-computer-runtime-$RELEASE_VERSION.tgz"
          )

          shopt -s nullglob
          archives=("$pack_dir"/*.tgz)
          if (( ${#archives[@]} != ${#expected[@]} )); then
            echo >&2 "Expected ${#expected[@]} npm tarballs; found ${#archives[@]}"
            printf '%s\n' "${archives[@]}" >&2
            exit 1
          fi

          for entry in "${expected[@]}"; do
            package="${entry%%|*}"
            archive="${entry#*|}"
            if [[ ! -f "$pack_dir/$archive" ]]; then
              echo >&2 "Missing expected npm tarball: $archive"
              exit 1
            fi

            manifest="$(tar -xOzf "$pack_dir/$archive" package/package.json)"
            manifest_name="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).name)' "$manifest")"
            manifest_version="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).version)' "$manifest")"
            if [[ "$manifest_name" != "$package" || "$manifest_version" != "$RELEASE_VERSION" ]]; then
              echo >&2 "$archive contains $manifest_name@$manifest_version; expected $package@$RELEASE_VERSION"
              exit 1
            fi
          done

      - name: Publish packages in dependency order
        shell: bash
        run: |
          pack_dir="$RUNNER_TEMP/npm-packs"
          packages=(
            "@oro-computer/runtime-linux-x64|oro-computer-runtime-linux-x64-$RELEASE_VERSION.tgz"
            "@oro-computer/runtime-linux-arm64|oro-computer-runtime-linux-arm64-$RELEASE_VERSION.tgz"
            "@oro-computer/runtime-darwin-x64|oro-computer-runtime-darwin-x64-$RELEASE_VERSION.tgz"
            "@oro-computer/runtime-darwin-arm64|oro-computer-runtime-darwin-arm64-$RELEASE_VERSION.tgz"
            "@oro-computer/runtime-win32-x64|oro-computer-runtime-win32-x64-$RELEASE_VERSION.tgz"
            "@oro-computer/runtime-node|oro-computer-runtime-node-$RELEASE_VERSION.tgz"
            "@oro-computer/runtime|oro-computer-runtime-$RELEASE_VERSION.tgz"
          )

          for entry in "${packages[@]}"; do
            package="${entry%%|*}"
            archive="$pack_dir/${entry#*|}"
            local_integrity="sha512-$(openssl dgst -sha512 -binary "$archive" | base64 -w 0)"
            published_integrity="$(npm view "$package@$RELEASE_VERSION" dist.integrity 2>/dev/null || true)"

            if [[ -n "$published_integrity" ]]; then
              if [[ "$published_integrity" != "$local_integrity" ]]; then
                echo >&2 "$package@$RELEASE_VERSION already exists with different package contents"
                exit 1
              fi
              echo "$package@$RELEASE_VERSION is already published with the verified integrity; skipping"
              continue
            fi

            npm publish "$archive" --access public
          done
