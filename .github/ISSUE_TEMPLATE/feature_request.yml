name: Feature request
description: Propose a focused improvement to Oro Runtime.
title: 'feat: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the use case and why existing behavior does not address it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior rather than only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: scope
    attributes:
      label: Primary scope
      options:
        - JavaScript API
        - Native runtime
        - CLI and tooling
        - MCP
        - Build or packaging
        - Documentation
    validations:
      required: true
