name: Bug report
description: Report a reproducible Oro Runtime problem.
title: 'bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include secrets or security vulnerabilities. Report vulnerabilities privately through SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Oro Runtime version
      description: Paste the output of `oroc --version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, version, and CPU architecture.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest project, configuration, and command sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Remove credentials and sensitive application data.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
